[project]
name = "xknxeditor-web"
version = "0.1.0"
description = "Web backend of the XKNX Editor Home Assistant add-on"
license = "GPL-2.0-only"
requires-python = ">=3.13"
# The xknxeditor-* packages and xknx are installed from upstream wheels by the Dockerfile; they are
# deliberately not declared here because they are not on PyPI.
dependencies = [
    "starlette>=0.47",
    "uvicorn>=0.34",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "mcp>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxeditor_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
